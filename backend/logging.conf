[loggers]
keys=root,app

[handlers]
keys=console,file

[formatters]
keys=json,simple

[logger_root]
level=INFO
handlers=console,file

[logger_app]
level=DEBUG
handlers=console,file
qualname=app
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=simple
args=(sys.stdout,)

[handler_file]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=json
args=('logs/app.log', 'a', 10485760, 5)

[formatter_json]
class=pythonjsonlogger.json.JsonFormatter
format=%(asctime)s %(name)s %(levelname)s %(message)s

[formatter_simple]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
